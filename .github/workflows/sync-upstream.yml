name: Sync upstream Trakt plugin

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clone upstream with full history
        run: git clone https://github.com/DemoJameson/Proxy.Modules.git upstream

      - name: Restore EplayerX into current upstream source
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          removal="0886a1d912cfa78a395e5a37278903be9537c1f6"
          parent="$(git rev-parse "${removal}^")"
          head="$(git rev-parse origin/main)"
          source_path="trakt_simplified_chinese/src"

          echo "Upstream HEAD: $head"
          echo "EplayerX removal commit: $removal"
          echo "EplayerX parent: $parent"

          # Keep every current upstream file (build system, package metadata, generated files, etc.).
          # Only the source tree is reconstructed from the pre-removal version and then receives
          # all source-only changes made after the EplayerX removal commit.
          git checkout "$parent" -- "$source_path"
          git diff --binary "$removal" "$head" -- "$source_path" > /tmp/upstream-source-after-removal.patch

          if [ -s /tmp/upstream-source-after-removal.patch ]; then
            git apply --3way /tmp/upstream-source-after-removal.patch
          fi

          grep -R -q 'EPLAYERX' "$source_path"
          grep -R -q 'eplayerxButtonOrder' "$source_path"
          echo "EplayerX restored; current upstream source changes preserved."

      - name: Install dependencies
        working-directory: upstream
        run: npm ci

      - name: Build upstream plugin with EplayerX restored
        working-directory: upstream
        run: npm run build:trakt

      - name: Validate generated plugin
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test -s trakt_simplified_chinese/trakt_simplified_chinese.plugin
          test -s trakt_simplified_chinese/trakt_simplified_chinese.js
          grep -q 'EplayerX' trakt_simplified_chinese/trakt_simplified_chinese.plugin
          grep -q 'eplayerx' trakt_simplified_chinese/trakt_simplified_chinese.js
          echo "Generated plugin contains EplayerX support."

      - name: Publish generated plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trakt_simplified_chinese
          cp upstream/trakt_simplified_chinese/trakt_simplified_chinese.js trakt_simplified_chinese/trakt_simplified_chinese.js
          sed -e 's#https://raw.githubusercontent.com/DemoJameson/Proxy.Modules/main/trakt_simplified_chinese/trakt_simplified_chinese.js#https://raw.githubusercontent.com/lucere30/trakt-enhance/main/trakt_simplified_chinese/trakt_simplified_chinese.js#g' upstream/trakt_simplified_chinese/trakt_simplified_chinese.plugin > trakt_simplified_chinese/trakt_simplified_chinese.plugin
          grep -q 'EplayerX' trakt_simplified_chinese/trakt_simplified_chinese.plugin
          grep -q 'lucere30/trakt-enhance/main/trakt_simplified_chinese/trakt_simplified_chinese.js' trakt_simplified_chinese/trakt_simplified_chinese.plugin

      - name: Remove generated upstream checkout
        run: rm -rf upstream

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trakt_simplified_chinese/trakt_simplified_chinese.plugin trakt_simplified_chinese/trakt_simplified_chinese.js
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git commit -m "Sync upstream Trakt plugin and restore EplayerX"
          git push
