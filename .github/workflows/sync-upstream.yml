# Sync pipeline v6. The workflow only orchestrates; all logic lives in scripts/:
#   restore-eplayerx.sh -> apply-customizations.py -> install-translation-policy.py
#   -> validate-source.py -> build -> publish.py
name: Sync upstream Trakt plugin

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    paths:
      - .github/workflows/sync-upstream.yml
      - scripts/**

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Full history is required: the EplayerX restore replays commits made after its removal.
      - name: Clone upstream
        run: git clone https://github.com/DemoJameson/Proxy.Modules.git upstream

      - name: Restore EplayerX
        run: scripts/restore-eplayerx.sh

      - name: Apply custom feature controls
        run: python3 scripts/apply-customizations.py

      - name: Install translation scope policy
        run: python3 scripts/install-translation-policy.py

      - name: Validate patched source
        run: python3 scripts/validate-source.py

      - name: Build
        working-directory: upstream
        run: |
          npm ci
          npm run build:trakt

      - name: Publish artifacts
        run: python3 scripts/publish.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(git -C upstream rev-parse --short HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A trakt_simplified_chinese
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Sync upstream ${upstream_sha}"
          git push
