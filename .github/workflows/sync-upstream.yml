name: 跟随上游同步

on:
  schedule:
    # 每 12 小时检查一次上游：UTC 00:23 和 12:23（北京时间 08:23 和 20:23）；GitHub 高峰期可能延迟
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # 保活时调用“启用工作流”接口需要
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 配置提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 同步上游并重放定制
        id: sync
        env:
          SYNC_REPORT: ${{ runner.temp }}/fork-sync-report.md
        run: bash fork/sync.sh

      - name: 推送
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:${{ github.ref_name }}

      # 公开仓库 60 天没有活动时，GitHub 会自动停用定时任务。上游长期不更新时本仓库不会有新提交，
      # 所以定时运行时：1) 调用“启用工作流”接口；2) 最近一次提交超过 45 天就推一个空提交。
      # GitHub 没有写明这两种方式是否都算“活动”，所以两个都做。
      - name: 保活（防止定时同步被停用）
        if: github.event_name == 'schedule' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable" || echo "启用接口调用失败，忽略"
          git fetch -q origin "${{ github.ref_name }}"
          last="$(git log -1 --format=%ct "origin/${{ github.ref_name }}")"
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "距最近一次提交 ${days} 天"
          if [ "$days" -ge 45 ]; then
            git commit --allow-empty -m "chore: 保活，防止定时同步被 GitHub 停用"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: 失败时开 issue 提醒
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/fork-sync-report.md
          UP_SHA: ${{ steps.sync.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="上游同步失败，需要处理"
          { [ -s "$REPORT" ] && cat "$REPORT" || echo "同步失败，详见运行日志。"; echo; echo "运行日志：$RUN_URL"; } > body.md
          NUM="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')"
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body-file body.md
          elif [ -n "$UP_SHA" ] && gh issue view "$NUM" --json body,comments -q '.body, .comments[].body' | grep -q "$UP_SHA"; then
            echo "该上游提交已报告过，不重复提醒。"
          else
            gh issue comment "$NUM" --body-file body.md
          fi
